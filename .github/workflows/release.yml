name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json and extract changelog section
        id: notes
        run: |
          node -e "
          const fs = require('fs');

          const tag = process.env.GITHUB_REF_NAME; // e.g. v1.1.0
          const tagVersion = tag.replace(/^v/, '');

          const pkg = require('./package.json');
          if (pkg.version !== tagVersion) {
            console.error('Tag ' + tag + ' does not match package.json version ' + pkg.version + '.');
            process.exit(1);
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const lines = changelog.split(/\r?\n/);
          const headingPrefix = '## ' + tagVersion + ' —';
          const startIndex = lines.findIndex(line => line.startsWith(headingPrefix));

          if (startIndex === -1) {
            console.error('No CHANGELOG.md section found for heading starting with \"' + headingPrefix + '\".');
            process.exit(1);
          }

          let endIndex = lines.length;
          for (let i = startIndex + 1; i < lines.length; i++) {
            if (lines[i].startsWith('## ')) {
              endIndex = i;
              break;
            }
          }

          const section = lines.slice(startIndex + 1, endIndex).join('\n').trim();
          if (!section) {
            console.error('CHANGELOG.md section for ' + tagVersion + ' is empty.');
            process.exit(1);
          }

          fs.writeFileSync('release-notes.md', section + '\n');
          console.log('Extracted release notes for ' + tagVersion + ':');
          console.log(section);
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
