name: Bug report
description: Something in getit is broken or not behaving as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, in order, starting from a clean session if possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How installed
      options:
        - skills CLI (npx skills add)
        - Claude Code plugin
        - manual clone
        - Claude.ai upload
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: getit version
      description: From package.json, plugin.json, or the version shown by /plugin.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
    validations:
      required: true
  - type: textarea
    id: status-output
    attributes:
      label: Output of /getit status (if relevant)
      render: text
    validations:
      required: false
